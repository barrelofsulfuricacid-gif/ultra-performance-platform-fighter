name: M3 clean-machine CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux desktop SDK headers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev

      - name: Bootstrap pinned native tools
        if: runner.os != 'Windows'
        shell: bash
        run: ./tools/bootstrap.sh

      - name: Run native release workflow
        if: runner.os != 'Windows'
        shell: bash
        run: ./tools/workflow.sh release

      - name: Bootstrap pinned native tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\bootstrap.ps1

      - name: Run native release workflow
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\tools\workflow.ps1 release

  setup-contract:
    name: Setup contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bootstrap without duplicate smoke work
        shell: bash
        run: ./tools/bootstrap.sh --no-smoke

      - name: Verify setup, locks, presets, and CI
        shell: bash
        run: ./tools/verify_m1_setup.sh

      - name: Verify deterministic simulation kernel
        shell: bash
        run: ./tools/verify_m2_kernel.sh

      - name: Qualify SQLite history, comparisons, and graphs
        shell: bash
        run: ./tools/verify_m3_performance.sh "$RUNNER_TEMP/m3-performance"

      - name: Qualify verifier detectors and issue lifecycle
        shell: bash
        run: ./tools/verify_m3_verifier.sh "$RUNNER_TEMP/m3-verifier"

      - name: Capture profile-only Tracy workload
        shell: bash
        run: |
          PF_SDL_UNIX_CONSOLE_BUILD=ON \
          PF_PROFILE_CAPTURE_SECONDS=1 \
            ./tools/capture_profile.sh CI "$RUNNER_TEMP/m3-profile"

  sanitizer:
    name: Linux address and UB sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux desktop SDK headers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev

      - name: Bootstrap pinned native tools
        shell: bash
        run: ./tools/bootstrap.sh --no-smoke

      - name: Run sanitizer workflow
        shell: bash
        run: ./tools/workflow.sh sanitizer

  rl-python:
    name: Gymnasium 1.3 vector API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bootstrap pinned native tools
        shell: bash
        run: ./tools/bootstrap.sh --no-smoke

      - name: Build the headless C ABI and shared adapter library
        shell: bash
        run: ./tools/workflow.sh headless

      - name: Install the pinned optional Python adapter
        shell: bash
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            "gymnasium==1.3.0"
          .venv/bin/python -m pip install --disable-pip-version-check \
            --no-deps -e bindings/python

      - name: Verify Gymnasium API, determinism, and boundary overhead
        shell: bash
        run: PYTHON_COMMAND="$PWD/.venv/bin/python" ./tools/verify_m2_python.sh

  web:
    name: Emscripten and Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Bootstrap pinned web tools
        shell: bash
        run: ./tools/bootstrap.sh --web --no-smoke

      - name: Build browser target
        shell: bash
        run: ./tools/workflow.sh web

      - name: Compare native and Wasm replay corpus
        shell: bash
        run: PF_REQUIRE_WEB_REPLAY=1 ./tools/verify_m2_replay.sh

      - name: Run generated Wasm in Chrome
        shell: bash
        run: ./tools/verify_web_smoke.sh
