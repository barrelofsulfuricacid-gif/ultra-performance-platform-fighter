[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pf-gymnasium"
version = "0.1.0"
description = "Thin Gymnasium vector wrapper for the authored-C platform-fighter simulation"
requires-python = ">=3.10"
dependencies = [
    "gymnasium==1.3.0",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
